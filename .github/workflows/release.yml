name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history so we can push a commit back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VERSION in _version.py
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s/^VERSION = \".*\"/VERSION = \"${TAG}\"/" _version.py
          echo "Updated VERSION to ${TAG}"
          grep "^VERSION" _version.py

      - name: Commit updated _version.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _version.py
          # Only commit if there's an actual change
          git diff --cached --quiet || git commit -m "chore: bump VERSION to ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
