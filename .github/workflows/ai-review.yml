name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@91a31cd8e7e81d063cafc173b094422e986d5313  # v1.3.2 (액션까지 SHA 고정)
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "review"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
