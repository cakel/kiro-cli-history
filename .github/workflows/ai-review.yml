name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@0cb48b93bc0084553a71a05d9997af334eacd25c  # v1.2.1 (액션까지 SHA 고정)
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "review"]'
      max-diff-bytes: '500000'   # 기본 200000 — 넘으면 리뷰 중지 안내(skipped_oversize, 승인 아님)
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
