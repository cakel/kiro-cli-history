name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@86406954488dc77bbf657cc639ba5bab86f366cf  # v1.3.0 (액션까지 SHA 고정)
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "review"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
