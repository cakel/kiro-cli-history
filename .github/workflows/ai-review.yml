name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@6b408b4bda969e78bf3ce90cf7c4a44ccf312d4f  # main
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "llm-reviewer"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
