name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@345d0550cf36551ea34d54dea9ffe557d5ec4d8c  # main
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "llm-reviewer"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
