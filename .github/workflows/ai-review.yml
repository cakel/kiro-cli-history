name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@6b404463c3225f9ae79dc6d037c18e91f07e07ad  # v1.3.1 (액션까지 SHA 고정)
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "review"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
