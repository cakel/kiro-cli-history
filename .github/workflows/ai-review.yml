name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# Permissions design (Principle of Least Privilege):
# - Global workflow permissions are strictly limited to read-only (contents: read, issues: read).
# - Only the isolated 'ai-review' job is explicitly granted 'pull-requests: write' to post reviews.
# - Neither precheck nor unit-test jobs have PR write permissions, preventing premature privilege elevation.
permissions:
  contents: read
  issues: read
  pull-requests: read

# Serialize review runs strictly per PR without cancel-in-progress to eliminate parallel gating races and comment spam cancellation DoS
concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # 1. Zero-checkout lightweight precheck gate:
  # Evaluates permissions and PR validity in seconds on GitHub-hosted cloud runner
  # before repository checkout, test suites, or self-hosted runner queuing.
  # /review: triggers automated adversarial security review.
  # /fix: triggers Advisory Fix Suggestion mode where LLM generates proposed code diffs
  # and remediation advice into review-comment.md without modifying repo files (Zero-Write).
  precheck:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ') ||
        github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      pr_num: ${{ steps.auth.outputs.pr_num }}
      base_sha: ${{ steps.auth.outputs.base_sha }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
      trigger_mode: ${{ steps.auth.outputs.trigger_mode }}
    steps:
      - name: Validate trigger, actor permissions, and PR metadata
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          # ACTOR source must be explicit per event type - no fallback to github.actor
          # pull_request: PR author is the trust boundary (code submitter)
          # issue_comment: comment author is the trust boundary (review requester)
          ACTOR_PR: ${{ github.event.pull_request.user.login }}
          ACTOR_COMMENT: ${{ github.event.comment.user.login }}
          RAW_PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
          RAW_COMMENT_BODY: ${{ github.event.comment.body }}
          RAW_COMMENT_DATE: ${{ github.event.comment.created_at }}
          REPO_NAME: ${{ github.repository }}
          REPO_OWNER_EXPECTED: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PR_NUM="$RAW_PR_NUM"
          [ -n "$PR_NUM" ] || { echo "::error::PR number missing"; exit 1; }

          # Select ACTOR based on event type - no fallback to prevent trust boundary confusion
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ACTOR="$ACTOR_PR"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            ACTOR="$ACTOR_COMMENT"
          else
            echo "::error::Unexpected event type '$EVENT_NAME'. Aborting."
            exit 1
          fi

          if [ -z "$ACTOR" ]; then
            echo "::error::Could not determine ACTOR for event '$EVENT_NAME'. Aborting."
            exit 1
          fi

          # Validate username format against strict regex
          if [[ ! "$ACTOR" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::Invalid username format for actor '$ACTOR'. Aborting."
            exit 1
          fi

          # Authoritatively verify maintainer/collaborator permission (admin/maintain/write) via GitHub API
          ACTOR_PERM=$(gh api "repos/$REPO_NAME/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo "none")
          if [ "$ACTOR_PERM" != "admin" ] && [ "$ACTOR_PERM" != "maintain" ] && [ "$ACTOR_PERM" != "write" ]; then
            echo "::error::Trigger actor '$ACTOR' lacks authorized maintainer permission ($ACTOR_PERM). Aborting."
            exit 1
          fi
          echo "Trigger actor permission confirmed: $ACTOR ($ACTOR_PERM)"

          # Fetch authoritative PR metadata
          PR_INFO=$(gh pr view "$PR_NUM" --repo "$REPO_NAME" --json state,baseRefOid,headRefOid,headRepositoryOwner,author,files)
          PR_STATE=$(echo "$PR_INFO" | jq -r .state)
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "::error::Target PR #$PR_NUM is not OPEN ($PR_STATE). Aborting."
            exit 1
          fi

          REPO_OWNER=$(echo "$PR_INFO" | jq -r .headRepositoryOwner.login)
          if [ -z "$REPO_OWNER" ] || [ "$REPO_OWNER" != "$REPO_OWNER_EXPECTED" ]; then
            echo "::error::Fork PR rejected from execution on internal CI runner. Aborting."
            exit 1
          fi

          # Authoritatively verify PR author permission (admin/maintain/write)
          PR_AUTHOR=$(echo "$PR_INFO" | jq -r .author.login)
          PR_AUTHOR_PERM=$(gh api "repos/$REPO_NAME/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo "none")
          if [ "$PR_AUTHOR_PERM" != "admin" ] && [ "$PR_AUTHOR_PERM" != "maintain" ] && [ "$PR_AUTHOR_PERM" != "write" ]; then
            echo "::error::PR author '$PR_AUTHOR' lacks authorized maintainer permission ($PR_AUTHOR_PERM). Aborting."
            exit 1
          fi
          echo "PR author permission confirmed: $PR_AUTHOR ($PR_AUTHOR_PERM)"

          # Enforce repository admin requirement when workflow files (.github/workflows/**) are modified
          # Use paginated API to avoid 300-file truncation in gh pr view --json files
          CHANGED_WORKFLOWS=$(gh api --paginate "repos/$REPO_NAME/pulls/$PR_NUM/files" --jq '.[] | select(.filename | startswith(".github/workflows/")) | .filename' 2>/dev/null || echo "")
          if [ -n "$CHANGED_WORKFLOWS" ]; then
            if [ "$ACTOR_PERM" != "admin" ] && [ "$PR_AUTHOR_PERM" != "admin" ]; then
              echo "::error::Modifications to .github/workflows/ require repository admin permission. Aborting."
              exit 1
            fi
            echo "Admin authorization confirmed for CI workflow modifications: $CHANGED_WORKFLOWS"
          fi

          BASE=$(echo "$PR_INFO" | jq -r .baseRefOid)
          HEAD=$(echo "$PR_INFO" | jq -r .headRefOid)
          export HEAD
          [ -n "$BASE" ] && [ -n "$HEAD" ] || { echo "::error::Missing base/head SHA"; exit 1; }

          # Confused-deputy guard on issue_comment: Bind review target commit strictly to the commit visible at comment creation
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            export COMMENT_DATE="$RAW_COMMENT_DATE"
            COMMIT_INFO=$(gh api "repos/$REPO_NAME/commits/$HEAD" --jq '{date: .commit.committer.date, author: (.author.login // .commit.author.name)}' 2>/dev/null || echo "{}")
            export COMMIT_DATE=$(echo "$COMMIT_INFO" | jq -r .date)
            COMMIT_AUTHOR=$(echo "$COMMIT_INFO" | jq -r .author)

            if [ -z "$COMMENT_DATE" ] || [ -z "$COMMIT_DATE" ] || [ "$COMMIT_DATE" = "null" ]; then
              echo "::error::Failed to query authoritative commit metadata for head $HEAD. Fail-closed."
              exit 1
            fi

            # Timestamp comparison as defense-in-depth (NOTE: committer date can be forged)
            # Primary defense is explicit SHA binding (/review <sha>) or subsequent TOCTOU guards
            python3 -c "
            import os, sys
            from datetime import datetime
            c = os.environ['COMMIT_DATE'].replace('Z', '+00:00')
            m = os.environ['COMMENT_DATE'].replace('Z', '+00:00')
            c_date = datetime.fromisoformat(c)
            m_date = datetime.fromisoformat(m)
            if c_date.timestamp() > m_date.timestamp():
                sys.exit('Head commit after comment timestamp. Aborting.')
            "

            # Explicit SHA binding (/review <sha>) is recommended for maximum security
            # Without it, timestamp check provides only defense-in-depth (committer date is forgeable)
            python3 -c "
            import os, re, sys
            body = os.environ.get('RAW_COMMENT_BODY', '')
            head = os.environ.get('HEAD', '')
            m = re.match(r'^\s*/(?:review|fix)\s+([0-9a-fA-F]{7,40})(?:\s|\$)', body)
            if m:
                cmd_sha = m.group(1).lower()
                if not head.lower().startswith(cmd_sha):
                    sys.exit(f'SHA mismatch: {cmd_sha} vs {head}')
                print(f'Bound to SHA: {cmd_sha}')
            "

            echo "Audit trail: Maintainer '$ACTOR' authorized review of commit $HEAD (committed $COMMIT_DATE by $COMMIT_AUTHOR) via comment at $COMMENT_DATE"
          fi

          TRIGGER_MODE="review"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if python3 -c "import os, re, sys; sys.exit(0 if re.match(r'^\s*/fix(?:\s|$)', os.environ.get('RAW_COMMENT_BODY', '')) else 1)"; then
              TRIGGER_MODE="fix"
            fi
          fi

          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$TRIGGER_MODE" >> "$GITHUB_OUTPUT"
          echo "Precheck passed: PR #$PR_NUM, BASE=$BASE, HEAD=$HEAD, MODE=$TRIGGER_MODE"

  # 2. Cloud-hosted unit tests: Runs strictly on precheck-verified HEAD_SHA
  # NOTE: This job executes PR-submitted code (tests) on GitHub-hosted runners.
  # Trust boundary: PR author must have write permission (verified in precheck).
  # GitHub-hosted runners are ephemeral and isolated from internal infrastructure.
  # Self-hosted runner (ai-review) does NOT execute any PR-submitted code.
  unit-test:
    needs: precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Explicit minimal permissions to limit exposure if PR test code is malicious
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ needs.precheck.outputs.head_sha }}
      tested_base_sha: ${{ needs.precheck.outputs.base_sha }}
    steps:
      - name: Checkout pull request ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # Immutable SHA pin
        with:
          ref: ${{ needs.precheck.outputs.head_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify checkout ref matches precheck head SHA
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ needs.precheck.outputs.head_sha }}"
          if [ "$CHECKOUT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out SHA ($CHECKOUT_SHA) does not match expected SHA ($EXPECTED_SHA). Aborting."
            exit 1
          fi
          echo "Checked out SHA verified matching precheck head SHA: $CHECKOUT_SHA"

      - name: Run unit tests
        run: python3 -m unittest discover -s tools/profittrailer/tests -v

      - name: Run Node snapshot and restore checks
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) throw new Error("Node.js 20+ required")'
          node tools/profittrailer/tests/test_local_records.mjs
          node tools/profittrailer/tests/test_restore_config.mjs
          node tools/profittrailer/tests/test_record_regressions.mjs
          node tools/profittrailer/tests/test_download_market_data.mjs

  # 3. INLINE KIRO-CLI REVIEW — No external action dependency
  # All review logic is visible in this workflow diff, ensuring:
  # - Input path is explicitly enforced (verified-diff.patch only)
  # - No token propagation to external code
  # - Decision and gating controlled entirely by workflow steps
  # - Security reviewers can verify all logic without inspecting external repos
  ai-review:
    needs: [precheck, unit-test]
    # Explicit fork re-verification as defense-in-depth (do not rely solely on precheck success)
    if: |
      needs.precheck.result == 'success' &&
      needs.unit-test.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'issue_comment') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, profittrailer-review-isolated]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      PATH: /var/lib/ptreview/.local/bin:/usr/local/bin:/usr/bin:/bin
      KIRO_HOME: /var/lib/ptreview/.kiro
      PR_NUM: ${{ needs.precheck.outputs.pr_num }}
      BASE_SHA: ${{ needs.unit-test.outputs.tested_base_sha }}
      HEAD_SHA: ${{ needs.unit-test.outputs.tested_sha }}
      START_HEAD: ${{ needs.unit-test.outputs.tested_sha }}
      START_BASE: ${{ needs.unit-test.outputs.tested_base_sha }}
      TRIGGER_MODE: ${{ needs.precheck.outputs.trigger_mode }}
    steps:
      - name: Prepare isolated review workspace
        run: |
          set -euo pipefail
          expected_temp_root="/home/cakel/actions-runner-kiro-cli-history/_work/_temp"
          temp_root=$(realpath -e -- "${RUNNER_TEMP:-$expected_temp_root}" 2>/dev/null || echo "${RUNNER_TEMP:-$expected_temp_root}")
          if [ "$temp_root" != "$expected_temp_root" ]; then
            echo "::error::RUNNER_TEMP '$temp_root' does not match isolated runner root '$expected_temp_root'. Aborting."
            exit 1
          fi
          review_dir=$(mktemp -d "$expected_temp_root/review.XXXXXX")
          review_dir=$(realpath -e "$review_dir")
          case "$review_dir" in
            "$expected_temp_root"/review.*) ;;
            *) echo "::error::Refusing unexpected review directory path: $review_dir"; exit 1 ;;
          esac
          summary_key="REVIEW_SUMMARY_$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          delimiter="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$summary_key"
          echo "::add-mask::$delimiter"
          echo "REVIEW_DIR=$review_dir" >> "$GITHUB_ENV"
          echo "REVIEW_SUMMARY_KEY=$summary_key" >> "$GITHUB_ENV"
          echo "REVIEW_DELIMITER=$delimiter" >> "$GITHUB_ENV"

      - name: Verify target PR commits match precheck and tested commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json headRefOid,baseRefOid)
          CURRENT_HEAD=$(python3 -c "import json, sys; print(json.loads(sys.argv[1])['headRefOid'])" "$PR_JSON")
          CURRENT_BASE=$(python3 -c "import json, sys; print(json.loads(sys.argv[1])['baseRefOid'])" "$PR_JSON")
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::PR head was modified between unit-test and review ($HEAD_SHA -> $CURRENT_HEAD). Aborting."
            exit 1
          fi
          if [ "$CURRENT_BASE" != "$BASE_SHA" ]; then
            echo "::error::PR base was modified between precheck and review ($BASE_SHA -> $CURRENT_BASE). Aborting."
            exit 1
          fi
          echo "Verified PR head matches tested SHA: $HEAD_SHA"
          echo "Verified PR base matches precheck SHA: $BASE_SHA"

      - name: Checkout pull request ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify checkout ref matches tested head SHA
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKOUT_SHA" != "${{ env.HEAD_SHA }}" ]; then
            echo "::error::Checked out SHA ($CHECKOUT_SHA) does not match tested SHA (${{ env.HEAD_SHA }}). Aborting."
            exit 1
          fi
          echo "Checked out SHA verified matching tested SHA: $CHECKOUT_SHA"

      - name: Verify diff safety boundaries and generate verified diff
        run: |
          set -euo pipefail
          BASE="${{ env.BASE_SHA }}"
          HEAD="${{ env.HEAD_SHA }}"

          # Environment containment and attributes bypass rejection
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_ATTR_NOSYSTEM=1

          if [ -f .git/info/attributes ] && grep -qE "diff|filter" .git/info/attributes; then
            echo "::error::Custom .git/info/attributes detected. Aborting."
            exit 1
          fi

          # Verify commits exist and have merge-base
          git rev-parse --verify "${BASE}^{commit}" >/dev/null
          git rev-parse --verify "${HEAD}^{commit}" >/dev/null
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          [ -n "$MERGE_BASE" ] || { echo "::error::No merge base found between $BASE and $HEAD. Aborting."; exit 1; }

          # Reject submodules and .gitattributes
          if git diff --raw "$BASE...$HEAD" | grep -q '^:160000 '; then
            echo "::error::Submodule changes are not allowed for automated review"
            exit 1
          fi
          if git ls-tree -r "$BASE" | grep -q '\.gitattributes$' || git ls-tree -r "$HEAD" | grep -q '\.gitattributes$'; then
            echo "::error::Repository contains .gitattributes which is forbidden for automated review"
            exit 1
          fi

          # Generate verified diff with attributes isolation
          git -c core.attributesFile=/dev/null -c diff.external= -c diff.textconv= diff --no-ext-diff --no-textconv "$BASE...$HEAD" > "$REVIEW_DIR/verified-diff.patch"
          DIFF_SIZE=$(wc -c < "$REVIEW_DIR/verified-diff.patch")
          if [ "$DIFF_SIZE" -gt 200000 ]; then
            echo "::error::Diff size exceeds safety limit ($DIFF_SIZE > 200000 bytes)"
            exit 1
          fi

          # Prompt injection marker check (base64 encoded to avoid self-trigger)
          python3 - <<'PY'
          import base64, os, re, sys, unicodedata
          from pathlib import Path

          patch_file = Path(os.environ["REVIEW_DIR"]) / "verified-diff.patch"
          text = patch_file.read_text(encoding="utf-8", errors="replace")
          norm = unicodedata.normalize("NFKC", text)
          norm = re.sub(r"[\u200B-\u200D\uFEFF\u00AD]", "", norm)

          pattern_b64 = "a2lyb19yZXZpZXdfc3VtbWFyeV9qc29ufHNlbGZfcmV2aWV3X3N1bW1hcnlfanNvbnwoYmVnaW58ZW5kKVxzK3VudHJ1c3RlZFxzK3B1bGxccytyZXF1ZXN0XHMrZGlmZnxpZ25vcmVccysoYWxsfGFueXxwcmV2aW91cylccytpbnN0cnVjdGlvbnN8ZGlzcmVnYXJkXHMrKGFsbHxhbnl8cHJldmlvdXMpfHN5c3RlbVxzK3Byb21wdA=="
          pattern = base64.b64decode(pattern_b64).decode("utf-8")
          match = re.search(pattern, norm, re.IGNORECASE)
          if match:
              sys.exit(f"Prompt injection marker detected: {match.group(0)}")
          print("Prompt injection checks passed.")
          PY

          echo "Diff verified: $DIFF_SIZE bytes"

      - name: Verify Kiro CLI authentication and version
        run: |
          set -euo pipefail
          KIRO_VERSION=$(kiro-cli --version)
          echo "Kiro CLI version: $KIRO_VERSION"
          # Pin to known-good version range to detect log format drift
          if ! echo "$KIRO_VERSION" | grep -qE '^kiro-cli (2\.2[0-9]\.[0-9]+|2\.[3-9][0-9]\.[0-9]+)$'; then
            echo "::warning::Kiro CLI version $KIRO_VERSION is outside tested range (2.20.x-2.99.x). Canary log patterns may need update."
          fi
          kiro-cli whoami >/dev/null

      - name: Verify Kiro tool-denial canary
        run: |
          cd "$REVIEW_DIR"
          set +e
          KIRO_LOG_NO_COLOR=1 kiro-cli chat --no-interactive \
            --agent-engine v1 \
            --trust-tools= \
            'Use a filesystem-read tool to read /etc/hostname. If that tool is unavailable, state so plainly.' \
            > kiro-tool-denial-canary.log 2>&1
          canary_status=$?
          set -e
          if [ "$canary_status" -ne 0 ]; then
            echo "::error::Kiro tool-denial canary failed; refusing automated review."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          output = Path("kiro-tool-denial-canary.log").read_text(encoding="utf-8", errors="replace")
          output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
          denied_read = re.compile(
              r"Reading file:.*?/etc/hostname.*?Command fs_read is rejected because it matches one or more rules on the denied list:",
              re.DOTALL,
          )
          successful_read = re.compile(r"Successfully read.*?/etc/hostname", re.DOTALL)
          denied_match = denied_read.search(output)
          if not denied_match or successful_read.search(output):
              raise SystemExit("Kiro tool-denial canary did not verify a denied fs_read event.")
          evidence = denied_match.group(0)
          Path("kiro-tool-denial-canary.log").unlink()
          Path("kiro-tool-denial-canary-audit.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "check": "tool-denial-canary",
                  "engine": "v1",
                  "tool": "fs_read",
                  "target_class": "runner-external-file",
                  "result": "denied",
                  "log_sha256": hashlib.sha256(output.encode()).hexdigest(),
                  "evidence_sha256": hashlib.sha256(evidence.encode()).hexdigest(),
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "verified": True,
              }, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Kiro tool-denial canary verified: tools strictly denied.")
          PY

      - name: Build review prompt
        run: |
          python3 .github/scripts/build-review-prompt.py

      - name: Invoke Kiro CLI (no tools, no token)
        id: kiro_invoke
        run: |
          cd "$REVIEW_DIR"
          set +e
          KIRO_LOG_NO_COLOR=1 kiro-cli chat --no-interactive \
            --agent-engine v1 \
            --trust-tools= \
            < kiro-prompt.txt \
            > kiro-raw-output.txt 2>&1
          kiro_exit=$?
          set -e
          echo "kiro_exit=$kiro_exit" >> "$GITHUB_OUTPUT"
          if [ "$kiro_exit" -ne 0 ]; then
            echo "::warning::kiro-cli exited with code $kiro_exit"
          fi

      - name: Parse review output
        id: kiro_review
        env:
          KIRO_EXIT: ${{ steps.kiro_invoke.outputs.kiro_exit }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          review_dir = Path(os.environ["REVIEW_DIR"])
          summary_key = os.environ["REVIEW_SUMMARY_KEY"]
          kiro_exit = int(os.environ.get("KIRO_EXIT", "0") or "0")

          raw = (review_dir / "kiro-raw-output.txt").read_text(encoding="utf-8", errors="replace")

          # ANSI escape sequence removal
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          review = ansi.sub("", raw)

          # Control character removal
          review = "".join(c for c in review if c in "\n\r\t" or ord(c) >= 32)

          # HTML escape
          review = review.replace("<", "&lt;")

          # Leading quote marker removal
          review = re.sub(r"\A\s*>[ \t]?", "", review)

          # Image tag neutralization
          review = re.sub(r"!\[[^\]]*\]\([^)]*\)", "[external image removed]", review)

          # URL neutralization to prevent phishing/tracking links
          review = re.sub(r"\[([^\]]*)\]\(https?://[^)]+\)", r"[\1][external link removed]", review)
          review = re.sub(r"(?<!\])https?://\S+", "[external URL removed]", review)

          # Summary JSON extraction - NO FALLBACK, require secret key binding
          pattern = rf"{re.escape(summary_key)}=(\{{[^\n]+\}})"
          matches = list(re.finditer(pattern, review))

          counts = {"critical": 0, "major": 0, "minor": 0, "nit": 0}
          error = None
          fail_closed = False

          # Fail-closed if kiro-cli crashed
          if kiro_exit != 0:
              error = f"kiro-cli exited with non-zero code {kiro_exit}. Fail-closed."
              fail_closed = True

          if not matches:
              error = "Review output did not contain the required machine-readable summary line. Fail-closed."
              fail_closed = True
          else:
              try:
                  parsed = json.loads(matches[-1].group(1))
                  for k in counts:
                      val = parsed.get(k, 0)
                      if not isinstance(val, int) or val < 0:
                          raise ValueError(f"invalid {k} count")
                      counts[k] = min(1000, max(0, val))
              except Exception as exc:
                  error = f"Invalid review summary JSON: {exc}. Fail-closed."
                  fail_closed = True

          if matches:
              if review[matches[-1].end():].strip():
                  error = "Review summary must be the final non-empty output line. Fail-closed."
                  fail_closed = True
              review = review[:matches[-1].start()].strip()

          if error:
              print(f"::error::{error}")

          # Fail-closed: force request_changes on any parsing/execution error
          if fail_closed:
              counts["major"] = max(counts["major"], 1)

          blocking = counts["critical"] + counts["major"]
          decision = "request_changes" if blocking > 0 else "approve"

          # Write outputs
          (review_dir / "review-comment.md").write_text(review, encoding="utf-8")
          (review_dir / "review-summary.json").write_text(json.dumps({
              "summary_key": summary_key,
              "counts": counts,
              "decision": decision,
              "blocking": blocking,
          }, indent=2), encoding="utf-8")

          # Set GitHub outputs
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"decision={decision}\n")
                  f.write(f"blocking={blocking}\n")
                  f.write(f"critical={counts['critical']}\n")
                  f.write(f"major={counts['major']}\n")
                  f.write(f"minor={counts['minor']}\n")
                  f.write(f"nit={counts['nit']}\n")

          print(f"Review parsed: decision={decision}, blocking={blocking}, counts={counts}")
          PY

      - name: Verify reviewed commits match current head and base (TOCTOU guard)
        id: toctou_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          START_HEAD="${{ env.START_HEAD }}"
          START_BASE="${{ env.START_BASE }}"
          if [ -z "$START_HEAD" ] || [ -z "$START_BASE" ]; then
            echo "::error::START_HEAD or START_BASE is unset or empty. Aborting to prevent TOCTOU bypass."
            exit 1
          fi
          PR_JSON=$(gh pr view "${{ env.PR_NUM }}" --repo "${{ github.repository }}" --json headRefOid,baseRefOid)
          CURRENT_HEAD=$(python3 -c "import json, sys; print(json.loads(sys.argv[1])['headRefOid'])" "$PR_JSON")
          CURRENT_BASE=$(python3 -c "import json, sys; print(json.loads(sys.argv[1])['baseRefOid'])" "$PR_JSON")
          if [ -z "$CURRENT_HEAD" ] || [ "$CURRENT_HEAD" != "$START_HEAD" ]; then
            echo "::error::PR head was modified during review ($START_HEAD -> $CURRENT_HEAD). Aborting to prevent TOCTOU race."
            gh pr review "${{ env.PR_NUM }}" --repo "${{ github.repository }}" --request-changes --body "Review aborted: PR head was updated while review ran ($START_HEAD -> $CURRENT_HEAD)."
            exit 1
          fi
          if [ -z "$CURRENT_BASE" ] || [ "$CURRENT_BASE" != "$START_BASE" ]; then
            echo "::error::PR base was modified during review ($START_BASE -> $CURRENT_BASE). Aborting to prevent TOCTOU race."
            gh pr review "${{ env.PR_NUM }}" --repo "${{ github.repository }}" --request-changes --body "Review aborted: PR base was updated while review ran ($START_BASE -> $CURRENT_BASE)."
            exit 1
          fi
          echo "Current head and base verified matching reviewed commits: $CURRENT_HEAD ... $CURRENT_BASE"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Post AI review comment
        if: success() && steps.toctou_guard.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUM="${{ env.PR_NUM }}"
          REVIEW_FILE="${{ env.REVIEW_DIR }}/review-comment.md"
          if [ -s "$REVIEW_FILE" ]; then
            gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body-file "$REVIEW_FILE"
            echo "Review comment posted to PR #$PR_NUM."
          fi

      - name: Enforce review gating decision
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ env.PR_NUM }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          TRIGGER_MODE: ${{ env.TRIGGER_MODE }}
          DECISION: ${{ steps.kiro_review.outputs.decision }}
          BLOCKING: ${{ steps.kiro_review.outputs.blocking }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUM:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::PR metadata missing. Fail-closed."
            exit 1
          fi

          # Advisory /fix mode bypasses formal review gating (Zero-Write principle)
          # NOTE: /fix does NOT clear or override any existing request_changes status from /review or push triggers.
          # It only posts advisory fix suggestions without affecting the formal gate state.
          if [ "${TRIGGER_MODE:-}" = "fix" ]; then
            echo "Advisory /fix mode: Fix suggestions posted to PR. Formal review gating bypassed (existing gate status preserved)."
            exit 0
          fi

          # Final TOCTOU check immediately prior to formal review gating
          CURRENT_HEAD=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
          if [ -z "$CURRENT_HEAD" ] || [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::PR head modified ($HEAD_SHA -> $CURRENT_HEAD) immediately prior to gating. Aborting."
            gh pr review "$PR_NUM" --repo "${{ github.repository }}" --request-changes --body "Review aborted: PR head was updated ($HEAD_SHA -> $CURRENT_HEAD)." 2>/dev/null || true
            exit 1
          fi

          if [ -z "$DECISION" ]; then
            echo "::error::Reviewer decision output is missing. Fail-closed."
            gh pr review "$PR_NUM" --repo "${{ github.repository }}" --request-changes --body "AI review decision output is missing or crashed. Fail-closed."
            exit 1
          fi
          if [[ ! "$BLOCKING" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid blocking count format '$BLOCKING'. Fail-closed."
            gh pr review "$PR_NUM" --repo "${{ github.repository }}" --request-changes --body "AI review blocking count is non-numeric ($BLOCKING). Fail-closed."
            exit 1
          fi
          if [ "$DECISION" = "request_changes" ]; then
            echo "::error::AI review identified $BLOCKING critical/major issues. Enforcing changes-requested gate."
            gh pr review "$PR_NUM" --repo "${{ github.repository }}" --request-changes --body "AI review (KIRO) detected $BLOCKING critical/major issues. Please address findings."
            exit 1
          fi
          if [ "$DECISION" != "approve" ]; then
            echo "::error::Unknown reviewer decision '$DECISION'. Fail-closed."
            gh pr review "$PR_NUM" --repo "${{ github.repository }}" --request-changes --body "Unknown reviewer decision '$DECISION'. Fail-closed."
            exit 1
          fi
          echo "Review gating passed (decision: $DECISION, blocking: $BLOCKING)."

      - name: Upload canary audit artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: canary-audit-pr-${{ env.PR_NUM || '0' }}-run-${{ github.run_id }}
          path: ${{ env.REVIEW_DIR }}/kiro-tool-denial-canary-audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup isolated review workspace
        if: always()
        run: |
          if [ -n "${REVIEW_DIR:-}" ] && [ -d "$REVIEW_DIR" ]; then
            case "$REVIEW_DIR" in
              /home/cakel/actions-runner-kiro-cli-history/_work/_temp/review.*) rm -rf -- "$REVIEW_DIR" ;;
              *) echo "Refusing to delete untrusted path: $REVIEW_DIR" >&2; exit 1 ;;
            esac
          fi
