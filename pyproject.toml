[project]
name = "kiro-cli-history"
version = "0.1.0"
description = "Terminal UI for browsing Kiro CLI conversation history"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
# integration/ is excluded from the default run; use -m integration to include
norecursedirs = ["__pycache__", ".pytest_cache", "integration"]
markers = [
    "integration: tests that require real ~/.kiro session data (slow)",
    "slow: Textual GUI/e2e tests that spin up a full app instance (2-5s each)",
]
# Default run excludes slow and integration markers
# Run all:   pytest tests/ -m "slow or integration" or pytest tests/ --run-slow
# Run slow:  pytest tests/ -m slow
addopts = "-m 'not slow and not integration'"
